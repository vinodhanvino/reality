[project]
name = "be"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "polars>=1.41.1",
    "tqdm>=4.67.3",
    "thefuzz>=0.22.1",
    "python-multipart>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
